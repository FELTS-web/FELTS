<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0909"><title>FELTS — Texas Hold'em</title><link href="https://fonts.googleapis.com/css2?family=Rye&display=swap" rel="stylesheet"><style>
:root{--bg:#161e1a;--tile:#232f29;--tile2:#2c3a33;--felt:#5b1f43;--felt2:#351225;--g:#b6814c;--gd:#715333;--gold:#f2c14e;--ink:#f1f6f2;--mut:#a8939c;--red:#d8564f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0c110f;color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.hidden{display:none!important}
#app{overflow:clip;position:relative;max-width:520px;height:100dvh;margin:0 auto;background:var(--bg);overflow:hidden}
@media(min-width:600px){#app{height:min(100dvh,920px);margin-top:max(0px,calc((100dvh - 920px)/2));border-radius:22px;box-shadow:0 0 0 1px #ffffff12,0 30px 80px #000}}
#pages{display:flex;height:100%;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.page{min-width:100%;height:100%;overflow-y:auto;padding:22px 16px 96px}
#nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:#111916;border-top:1px solid #ffffff10;padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;min-width:0;background:none;padding:10px 0 8px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.56rem;font-weight:600}
#nav button span{font-size:1.2rem;transition:transform .2s}
#nav button.on{color:var(--g)}#nav button.on span{transform:translateY(-2px) scale(1.15)}
h1{margin:0;font-size:1.7rem;letter-spacing:-.5px}h1 b{color:var(--g)}
h2{margin:0 0 12px}.mut{color:var(--mut)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.pill{background:var(--tile);border-radius:99px;padding:7px 13px;font-weight:700;font-size:.85rem}
.tile{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:var(--tile);border-radius:18px;padding:18px;margin-bottom:12px;box-shadow:0 4px 0 #0e1512;transition:transform .12s}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 #0e1512}
.tile .ic{font-size:2.2rem;width:56px;height:56px;border-radius:14px;background:var(--tile2);display:grid;place-items:center;flex:none}
.tile b{display:block;font-size:1.15rem}.tile small{color:var(--mut)}
.tile.main{background:var(--g);box-shadow:0 5px 0 var(--gd);color:#20100a}.tile.main small{color:#4a2d18}.tile.main .ic{background:#ffffff30}
.tile.main:active{box-shadow:0 2px 0 var(--gd)}
.tile.off{opacity:.5;pointer-events:none}
.card{background:var(--tile);border-radius:16px;padding:16px;margin-bottom:12px}
.btn{background:var(--g);box-shadow:0 4px 0 var(--gd);color:#20100a;font-weight:800;padding:13px;border-radius:12px;width:100%;margin-top:8px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gd)}.btn.alt{background:var(--tile2);box-shadow:0 4px 0 #0e1512;color:var(--ink)}
.row{display:flex;align-items:center;gap:12px;padding:11px 8px;border-radius:12px}.row.me{background:#b6814c25}
.row .rk{width:26px;color:var(--mut);font-weight:700}.row .nm{flex:1;font-weight:600}.row .e{font-weight:800;color:var(--gold)}
.av{width:84px;height:84px;border-radius:50%;background:var(--g);color:#20100a;display:grid;place-items:center;font-size:2.4rem;font-weight:800;margin:0 auto 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.stats div{background:var(--tile2);border-radius:12px;padding:12px}.stats b{display:block;font-size:1.3rem}
.sw{display:flex;justify-content:space-between;align-items:center;padding:10px 0}
.tg{width:52px;height:30px;border-radius:99px;background:#4a3a42;position:relative;transition:.2s}.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.tg.on{background:var(--g)}.tg.on::after{left:25px}
.ov{position:absolute;inset:0;z-index:5;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s;visibility:hidden}
#lobby{background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;opacity:0;text-align:center}
#lobby.on,#table.on{visibility:visible;opacity:1;transform:none}
.rings{width:110px;height:110px;border-radius:50%;border:3px solid var(--g);animation:ring 1.4s infinite}
@keyframes ring{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.6);opacity:0}}
#vs{display:flex;gap:18px;align-items:center;font-weight:800;animation:pop .5s}#vs .av{width:70px;height:70px;font-size:1.8rem;margin:0}
#table{background:radial-gradient(ellipse at 50% 40%,#1c2a23,#0b110e);transform:translateY(100%);display:flex;flex-direction:column;justify-content:space-between;padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:6}
.tbar{display:flex;justify-content:space-between;align-items:center}.tbar button{background:#0005;border-radius:12px;width:42px;height:42px;font-size:1.1rem}
#hud{background:#0006;padding:8px 16px;border-radius:99px;font-weight:800}
.seat{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px;border-radius:16px;transition:box-shadow .3s}.seat.turn{box-shadow:0 0 0 2px var(--gold),0 0 24px #f2c14e55}
.name{font-weight:700}.name em{font-style:normal;color:#d3b9c4;font-size:.75rem}.dealer{background:var(--gold);color:#222;border-radius:50%;padding:1px 6px;font-size:.7rem}
.chips{color:var(--gold);font-weight:800}.bet{min-height:1.2em;font-size:.85rem;color:#ffe9a8}
.center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
#pot{font-size:1.15rem;font-weight:800;color:var(--gold);background:#0005;padding:5px 16px;border-radius:99px}#msg{min-height:2.4em;font-size:.9rem;color:#f4e3ea}
.cards{display:flex;gap:6px;min-height:72px}
.c{width:48px;height:70px;border-radius:8px;background:#fff;color:#14181a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;box-shadow:0 3px 8px #0008}
.c b{font-size:1.25rem;line-height:1}.c i{font-style:normal;font-size:1.4rem;line-height:1}.c.red{color:#d02e2e}
.c.d{animation:deal .4s cubic-bezier(.2,.9,.3,1.2) backwards}
@keyframes deal{from{transform:translateY(-60px) rotate(-12deg) scale(.6);opacity:0}}
.c.back{background:repeating-linear-gradient(45deg,#2c5aa8,#2c5aa8 6px,#224787 6px,#224787 12px);border:2px solid #fff}
.c.empty{background:#ffffff12;box-shadow:none;border:1px dashed #ffffff30}
#controls{display:flex;flex-direction:column;gap:8px;background:#0007;padding:10px;border-radius:18px;transition:opacity .2s}#controls.offc{opacity:.4;pointer-events:none}
#controls .r{display:flex;gap:8px}#controls button{flex:1;padding:13px 4px;border-radius:12px;font-weight:800;background:var(--tile2);box-shadow:0 3px 0 #0e1512}
#controls button:active{transform:translateY(2px)}#controls button:disabled{opacity:.35}
#fold{background:#a8433d!important}#call{background:var(--g)!important;color:#20100a}#raise{background:#8f3c5a!important}
#controls .r.s button{padding:7px;font-size:.8rem;font-weight:600}input[type=range]{width:100%;accent-color:var(--g)}
.float{position:absolute;left:50%;top:42%;font-size:2.4rem;font-weight:900;color:var(--gold);text-shadow:0 2px 10px #000;animation:fl 1.3s ease-out forwards;pointer-events:none;z-index:9}
@keyframes fl{from{transform:translate(-50%,0) scale(.6);opacity:1}to{transform:translate(-50%,-90px) scale(1.3);opacity:0}}
#sheetBg{position:absolute;inset:0;background:#000b;z-index:20;opacity:0;pointer-events:none;transition:opacity .3s;display:flex;align-items:flex-end}
#sheetBg.on{opacity:1;pointer-events:auto}
#sheet{width:100%;background:#1c2722;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .4s cubic-bezier(.2,.8,.2,1);text-align:center}
#sheetBg.on #sheet{transform:none}
input.in{width:100%;padding:13px;border-radius:12px;border:2px solid #44343b;background:#111916;color:var(--ink);font:inherit;margin-top:10px}input.in:focus{outline:0;border-color:var(--g)}
.seg{display:flex;background:#111916;border-radius:12px;padding:4px;margin-bottom:6px}.seg button{flex:1;padding:9px;border-radius:9px;background:none;font-weight:700;color:var(--mut)}.seg button.on{background:var(--g);color:#20100a}
.err{color:var(--red);min-height:1.3em;font-size:.85rem;margin-top:8px}
.big{font-size:3.4rem;font-weight:900;animation:pop .6s .2s backwards}.up{color:#e08b5a}.down{color:#ff7a70}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.sum{display:flex;justify-content:space-around;margin:14px 0}.sum div{background:var(--tile2);padding:12px 18px;border-radius:14px}.sum b{display:block;font-size:1.5rem}

.chip{position:relative;isolation:isolate;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:.58rem;font-weight:900;border:3px dashed #fffa;box-shadow:0 2px 0 #0008,inset 0 0 0 2px #0003}
.c1{background:#f1f1f1;color:#333;border-color:#aaa}.c5{background:#d8564f;color:#fff}.c10{background:#2f8f4e;color:#fff}.c25{background:#2c5aa8;color:#fff}
.stack,.pp{display:flex;gap:6px;align-items:flex-end;justify-content:center;min-height:30px}#potPile{min-height:44px;min-width:60px}
.pile{position:relative;width:36px;flex:none;cursor:pointer}.pile .chip{position:absolute;left:1px}.pile .more{position:absolute;top:-14px;left:0;font-size:.62rem;font-weight:800;color:#ffe9a8}
.fl{position:absolute;z-index:30;pointer-events:none;transition:transform .6s cubic-bezier(.3,.8,.3,1),opacity .4s}
#oppStack{transform:scale(.8);transform-origin:bottom}
#tray{display:flex;flex-direction:column;gap:8px;background:#0008;padding:10px;border-radius:18px;animation:pop .25s}
#tray .r{display:flex;gap:8px}#tray .r button{flex:1;padding:11px 4px;border-radius:12px;font-weight:800;background:var(--tile2);box-shadow:0 3px 0 #0e1512}#tray button:disabled{opacity:.3}
#pend{text-align:center;min-height:62px}#pend .pt{font-weight:800;color:var(--gold);margin-top:4px}#pend small{color:var(--mut);font-weight:500}
#dens button{background:none!important;box-shadow:none!important;display:grid;place-items:center}#dens .chip{width:50px;height:50px;font-size:.95rem;border-width:4px;transition:transform .1s}#dens button:active .chip{transform:scale(.88)}
#tOk{background:var(--g)!important;color:#20100a;flex:2!important}
@media(max-height:780px){.c{width:40px;height:58px}.cards{min-height:58px}#oppStack{display:none}#msg{min-height:1.4em}}
.bar{height:10px;background:#111916;border-radius:99px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--g);border-radius:99px;transition:width 1s}
.rkrow{display:flex;align-items:center;gap:12px;padding:13px;border-radius:14px;background:var(--tile);margin-bottom:8px}.rkrow .nm{flex:1;font-weight:700}.rkrow small{display:block;color:var(--mut);font-weight:500}
.rkrow.cur{outline:2px solid var(--g);background:#3d2a30}.rkrow.done{opacity:.6}.xp{color:#e08b5a;font-weight:700;font-size:.8rem}
.inpot{display:inline-block;background:#0007;border-radius:99px;padding:3px 12px;font-size:.8rem;font-weight:700;color:#ffe9a8}
#nextBox{animation:pop .3s}#nextBox .btn{padding:16px;font-size:1.1rem;margin:0}
.os{background:#0005;border-radius:14px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:box-shadow .3s,opacity .3s;min-width:0}
.os.turn{box-shadow:0 0 0 2px var(--gold),0 0 18px #f2c14e66}.os.fold{opacity:.45}
.onm{font-size:.78rem;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.oc{font-size:.8rem;color:var(--gold);font-weight:800}
.cards.sm{min-height:42px;gap:3px}.cards.sm .c{width:28px;height:40px;border-radius:5px}.cards.sm .c b{font-size:.8rem}.cards.sm .c i{font-size:.85rem}.os .inpot{font-size:.68rem;padding:2px 8px}

.page{position:relative}.page>*{position:relative;z-index:1}.page>.decor{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.toon{position:absolute;width:var(--s);height:var(--s);filter:drop-shadow(0 8px 5px #000a);animation:bob 7s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-22px) rotate(10deg)}}
.shp{position:absolute;font-size:var(--s);color:#ffffff12;animation:spin 20s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.ring{position:absolute;border:3px solid #b6814c33;border-radius:50%;animation:pulse 5s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.25);opacity:.4}}
.dia{position:absolute;background:#ffffff0d;transform:rotate(45deg);animation:drift 9s ease-in-out infinite}@keyframes drift{50%{transform:rotate(45deg) translate(14px,-18px)}}
.btn.sm{width:auto;padding:8px 14px;margin:0;font-size:.85rem}.pv{margin:0;width:54px;height:54px;font-size:.9rem;flex:none}
/* chip looks: glow by tier, crystal shards on Elite + Unique */
.c1{--gc:#bfe9ff}.c5{--gc:#ff6a3d}.c10{--gc:#4dff88}.c25{--gc:#6aa8ff}
.t-mid{box-shadow:0 2px 0 #0008,0 0 9px var(--gc)}
.t-high,.t-uni{box-shadow:0 2px 0 #0008,0 0 12px var(--gc),0 0 26px var(--gc)}
.t-uni{animation:glint 1.8s ease-in-out infinite;border-style:solid;border-color:#ffe08a}

.t-uni.top::before{background:conic-gradient(#fff6c0,#ffd95a,#fff,#ffb81f,#fff6c0,#ffd95a,#fff,#ffb81f,#fff6c0);clip-path:polygon(evenodd,102.0% 50.0%,84.7% 54.6%,89.6% 60.6%,82.3% 63.4%,95.0% 76.0%,77.8% 71.3%,79.0% 79.0%,71.3% 77.8%,76.0% 95.0%,63.4% 82.3%,60.6% 89.6%,54.6% 84.7%,50.0% 102.0%,45.4% 84.7%,39.4% 89.6%,36.6% 82.3%,24.0% 95.0%,28.7% 77.8%,21.0% 79.0%,22.2% 71.3%,5.0% 76.0%,17.7% 63.4%,10.4% 60.6%,15.3% 54.6%,-2.0% 50.0%,15.3% 45.4%,10.4% 39.4%,17.7% 36.6%,5.0% 24.0%,22.2% 28.7%,21.0% 21.0%,28.7% 22.2%,24.0% 5.0%,36.6% 17.7%,39.4% 10.4%,45.4% 15.3%,50.0% -2.0%,54.6% 15.3%,60.6% 10.4%,63.4% 17.7%,76.0% 5.0%,71.3% 22.2%,79.0% 21.0%,77.8% 28.7%,95.0% 24.0%,82.3% 36.6%,89.6% 39.4%,84.7% 45.4%,102.0% 50.0%,83.0% 50.0%,81.9% 58.5%,78.6% 66.5%,73.3% 73.3%,66.5% 78.6%,58.5% 81.9%,50.0% 83.0%,41.5% 81.9%,33.5% 78.6%,26.7% 73.3%,21.4% 66.5%,18.1% 58.5%,17.0% 50.0%,18.1% 41.5%,21.4% 33.5%,26.7% 26.7%,33.5% 21.4%,41.5% 18.1%,50.0% 17.0%,58.5% 18.1%,66.5% 21.4%,73.3% 26.7%,78.6% 33.5%,81.9% 41.5%,83.0% 50.0%);animation:spin 9s linear infinite}
.t-uni::after{content:"";position:absolute;inset:2px;border-radius:50%;border:2px solid #ffe08a;box-shadow:inset 0 0 6px #ffe08a;z-index:1;pointer-events:none}
.sk-w1{background-image:radial-gradient(circle at 30% 25%,#fff,#0000 45%),radial-gradient(circle at 70% 85%,#0003,#0000 60%)}
.sk-w2{background-image:conic-gradient(#bfeaff99,#0000,#bfeaff99,#0000,#bfeaff99,#0000)}
.sk-r1{background-image:repeating-linear-gradient(45deg,#ffffff30 0 4px,#0000 4px 8px)}
.sk-r2{background-image:radial-gradient(circle at 50% 120%,#ffb347aa,#0000 65%)}
.sk-g1{background-image:radial-gradient(#ffffff55 2px,#0000 3px);background-size:8px 8px}
.sk-g2{background-image:conic-gradient(#b6ffcc88,#0000,#b6ffcc88,#0000)}
.sk-b1{background-image:conic-gradient(#ffffff40,#0000 25%,#ffffff30 50%,#0000 75%,#ffffff40)}
.sk-b2{background-image:radial-gradient(#fff 1px,#0000 2px),radial-gradient(circle at 30% 20%,#9bc4ff88,#0000 60%);background-size:9px 9px,100% 100%}
.sk-zw{background-image:conic-gradient(#fff,#ffe9a8aa,#bfe9ffaa,#fff,#ffe9a8aa,#bfe9ffaa,#fff);--gc:#ffd95a}
.sk-zr{background-image:radial-gradient(circle at 50% 110%,#ffe14aee,#ff8a2a88 45%,#0000 75%);--gc:#ffb347}
.sk-zg{background-image:conic-gradient(#b44dff88,#0000,#b44dff88,#0000,#b44dff88,#0000);--gc:#b44dff}
.sk-zb{background-image:linear-gradient(135deg,#fff36b66,#0000 40%,#fff36b44 70%,#0000);--gc:#fff36b}
.pvbox{width:80px;height:80px;display:grid;place-items:center;flex:none}
.load{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));justify-items:center;padding:8px 4px}.slot{display:flex;flex-direction:column;align-items:center}.slot small{color:var(--mut);font-size:.7rem;margin-top:-4px}
.rkrow{padding:6px 12px 6px 4px}.rkrow>.btn.sm,.rkrow>.xp,.rkrow>.mut{min-width:84px;text-align:center}.page{overflow-x:hidden}
@keyframes glint{50%{filter:brightness(1.35)}}
.chip .em{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;overflow:hidden}.chip .n:only-child{position:static;color:inherit;text-shadow:none;font-size:.72rem}.chip .n{position:absolute;right:1px;bottom:-1px;font-size:.55rem;font-weight:900;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000,0 0 2px #000;z-index:2}
#dens .n{font-size:.85rem;right:3px;bottom:1px}.pv .n{font-size:.75rem}.fl .n{display:none}
#tablearea{position:relative;flex:1;min-height:0;margin:4px 0}
#oval{position:absolute;left:2%;right:2%;top:7%;bottom:5%;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#70234f,var(--felt2) 80%);border:9px solid #5a3a22;box-shadow:inset 0 0 36px #000a,0 0 0 3px #2e1c10,0 14px 26px #000a}
#opps{position:absolute;inset:0}.os{position:absolute;transform:translate(-50%,-50%);width:94px}
#tablearea .center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:70%;z-index:2}
@media(max-width:470px){#tablearea .c{width:38px;height:56px}#tablearea .cards.sm .c{width:24px;height:34px}.os{width:84px}}

/* ===== FELTS v2 ===== */
.logo,h1,h2{font-family:'Rye',Georgia,serif;letter-spacing:1px}.logo{font-size:1.9rem;color:var(--gold);text-shadow:0 3px 0 #000,0 0 18px #f2c14e55}.logo b{color:#d8564f}
.btn,.tile b,#hud,.rkrow .nm{font-family:'Bungee','Rye',system-ui,sans-serif}.tile b{font-size:1rem}.btn{font-size:.9rem}
#app #nav{overflow:visible;justify-content:space-around;gap:0;padding:12px 4px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(#401b30,#1e0b15);border-top:3px solid #c9932a;box-shadow:0 -8px 20px #000b,inset 0 2px 0 #f2c14e55}
#app #nav button{flex:1;min-width:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:#b89ba8;font-family:'Bungee',system-ui;font-size:.5rem;letter-spacing:.5px;padding:0}

.learn-tier-legend {

}

/* Winding Dotted Pathway Container (20 Spread-Out Lessons) */
.chip-pathway-wrap {
  position: relative;
  width: 100%;
  max-width: 360px;
  height: 3690px;
  margin: 8px auto 48px;
}
.chip-pathway-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}
.path-dotted-bg {
  fill: none;
  stroke: rgba(255, 248, 225, 0.55);
  stroke-width: 5.5;
  stroke-linecap: round;
  stroke-dasharray: 1 16;
}
.path-dotted-lit {
  fill: none;
  stroke: #ffd23a;
  stroke-width: 6;
  stroke-linecap: round;
  stroke-dasharray: 1 16;
  filter: drop-shadow(0 0 6px #f2c14e);
}

/* Unified Poker Table Prop Decoration inside Pathway Coordinate Space */
.felt-decor-item {
  position: absolute;
  width: 118px;
  height: 94px;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 1;
  filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.68));
}
.felt-decor-item svg {
  width: 100%;
  height: 100%;
  display: block;
  overflow: visible;
}

/* Numbered Poker Chip Button on the Pathway */
.path-chip-node {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 70px;
  height: 70px;
  border-radius: 50%;
  border: 5px dashed rgba(255, 255, 255, 0.9);
  display: grid;
  place-items: center;
  cursor: pointer;
  z-index: 2;
  padding: 0;
  box-shadow:
    0 6px 0 rgba(0, 0, 0, 0.75),
    0 10px 20px rgba(0, 0, 0, 0.85),
    inset 0 0 0 4px rgba(0, 0, 0, 0.28),
    inset 0 0 0 9px rgba(255, 255, 255, 0.22);
  transition: transform .16s cubic-bezier(.2, .9, .3, 1.3), box-shadow .2s, filter .2s;
}
.path-chip-node:hover {
  transform: translate(-50%, -53%) scale(1.06);
}
.path-chip-node:active {
  transform: translate(-50%, -46%) scale(0.95);
}
.path-chip-node .chip-num {
  font-size: 1.35rem;
  line-height: 1;
  color: inherit;
  text-shadow: 0 2px 4px rgba(0, 0, 0, 0.65);
  pointer-events: none;
}
.path-chip-node.c1 .chip-num {
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
}
/* Elite Difficulty Poker Chip Styling (Lessons 18-20) */
.path-chip-node.c-elite,
.chip.c-elite {
  background: radial-gradient(circle at 35% 30%, #521542 0%, #24081d 58%, #0e030b 100%);
  color: #ffe885;
  border-color: #ffd23a;
  box-shadow:
    0 6px 0 #090207,
    0 0 0 2px rgba(255, 210, 58, 0.55),
    0 10px 22px rgba(0, 0, 0, 0.9),
    0 0 18px rgba(242, 193, 78, 0.45),
    inset 0 0 0 4px rgba(242, 193, 78, 0.32),
    inset 0 0 0 9px rgba(255, 210, 58, 0.18);
}
.path-chip-node.c-elite .chip-num {
  color: #ffe885;
  text-shadow: 0 0 8px rgba(255, 210, 58, 0.6), 0 2px 4px #000;
}
/* Active / Next Lesson Poker Chip highlight */
.path-chip-node.active-chip {
  box-shadow:
    0 6px 0 rgba(0, 0, 0, 0.8),
    0 0 0 3px var(--gold),
    0 0 24px #ffd23a,
    inset 0 0 0 4px rgba(0, 0, 0, 0.28),
    inset 0 0 0 9px rgba(255, 255, 255, 0.3);
  animation: chipPulse 2s ease-in-out infinite;
}
@keyframes chipPulse {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.2); }
}
/* Completed stars badge tucked neatly below chip rim */
.path-chip-stars {
  position: absolute;
  bottom: -16px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(6, 10, 20, 0.92);
  border: 1px solid rgba(242, 193, 78, 0.65);
  border-radius: 99px;
  padding: 0 6px;
  font-size: .58rem;

  box-shadow: 0 2px 6px #000c;
}
/* Level Description Plaque Next to Each Poker Chip */
.path-les-label {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 128px;
  background: rgba(7, 34, 19, 0.92);

}
.path-les-label:hover {
  border-color: var(--gold);
}
.path-les-label.side-right {

}
.path-les-label.side-left {
  right: calc(100% + 10px);

}
.path-les-label.elite-label {

.path-les-tier {

}
.path-les-tier.lv-1 {

}
.path-les-tier.lv-2 {
  background: linear-gradient(90deg, #8a1538, #52103a);

}
.path-les-label b {
  display: block;

}

  color: #ffe885;
}
.path-les-label span:not(.path-les-tier) {

/* Rectangular Luxury Casino Plaques for 1000, 5000, 10000 */
.chip.plaque {
  width: 52px;
  height: 32px;
  border-radius: 7px;
  border-style: solid;
  border-width: 2.5px;
  padding: 0 3px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  box-shadow:
    0 3px 0 rgba(0, 0, 0, 0.85),
    0 0 14px var(--gc, rgba(242, 193, 78, 0.5)),

}
.chip.plaque::before {

  inset: 3px;
  border-radius: 4px;
  border: 1px dashed rgba(255, 245, 200, 0.65);

}
.chip.plaque .plq-tag {

}
.chip.plaque .n,
.chip.plaque .n:only-child {
  position: static !important;
  inset: auto !important;
  width: auto !important;
  height: auto !important;
  display: block !important;
  font-size: .68rem !important;
  line-height: 1.05 !important;
  letter-spacing: -.3px;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.75);
}
.c1000.plaque {

}

}
.c1000.plaque .n,
.c1000.plaque .n:only-child {
  color: #2b1400 !important;
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.65);
}
.c5000.plaque {
  background: linear-gradient(135deg, #ff6b6b 0%, #c8192e 46%, #6e0815 88%, #3d030a 100%);
  color: #ffe885;
  border-color: #ffd23a;
  --gc: #ff3a4a;
}
.c10000.plaque {
  background: linear-gradient(135deg, #1b6ca8 0%, #0b385f 45%, #05192e 85%, #020c18 100%);
  color: #9ff6ff;
  border-color: #ffd23a;
  --gc: #00e5ff;

    0 3px 0 #000c,

/* Betting Tray Layout for Normal 6 Chips + Downward Arrow + Drawer */
#dens {
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 5px !important;
}
#dens .dens-main-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  width: 100%;
}
/* Never fade out unbettable chips/plaques — keep them 100% visible with the see-through red cross! */
#tray #dens button:disabled {
  opacity: 1 !important;
  cursor: not-allowed;
}
#dens.risk-mode .dens-main-row button.chip-btn {
  flex: 0 0 auto;
  padding: 2px !important;
}
#dens.risk-mode .dens-main-row .chip {
  width: 42px;
  height: 42px;
  font-size: .78rem;
  border-width: 3px;
}
#dens.risk-mode .dens-main-row .chip .n:only-child {
  font-size: .72rem;
}

/* Downward Arrow Button right after the 6th chip (100) */
#moreChipsBtn {
  flex: 0 0 auto !important;
  width: 34px !important;
  height: 42px !important;
  padding: 0 !important;
  border-radius: 11px !important;
  background: linear-gradient(145deg, #3a202c, #1c0e15) !important;
  border: 2px solid #f2c14e88 !important;
  box-shadow: 0 3px 0 #0b0508, 0 0 10px rgba(242, 193, 78, 0.25) !important;
  color: var(--gold) !important;
  display: flex !important;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  cursor: pointer;
  transition: transform .15s, border-color .2s, background .2s;
}
#moreChipsBtn:hover,
#moreChipsBtn.open {
  border-color: #ffd23a !important;
  background: linear-gradient(145deg, #58243c, #2a101d) !important;
}
#moreChipsBtn .arr-ic {
  font-size: .85rem;
  line-height: 1;
  transition: transform .22s cubic-bezier(.2, .9, .3, 1.2);
}
#moreChipsBtn.open .arr-ic {
  transform: rotate(180deg);
}
#moreChipsBtn .arr-lbl {
  font-size: .38rem;
  letter-spacing: .4px;
  color: #ffe8a0;
  line-height: 1;
}

/* Expanded High-Value Chips (250, 500) & Plaques (1000, 5000, 10000) Drawer */
#densMore {
  width: 100%;
  margin-top: 4px;
  padding: 8px 6px 6px;
  border-radius: 14px;
  background: rgba(10, 6, 9, 0.82);
  border: 1px solid rgba(242, 193, 78, 0.4);
  display: flex;
  flex-direction: column;
  gap: 7px;
  animation: pop .2s ease-out;

  display: flex;

  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
}
.dens-tier-tag {
  font-size: .52rem;
  color: var(--gold);
  letter-spacing: .8px;
  text-transform: uppercase;
  opacity: 0.9;
  width: 100%;
  text-align: center;
  margin-bottom: -3px;
}
#densMore .chip:not(.plaque) {
  width: 46px;
  height: 46px;
  font-size: .82rem;
  border-width: 3.5px;
}
#densMore .chip:not(.plaque) .n:only-child {

}
#densMore .chip.plaque {
  width: 76px;
  height: 44px;
  border-radius: 9px;
}
#densMore .chip.plaque .plq-tag {
  font-size: .42rem;
  letter-spacing: 1px;
}
#densMore .chip.plaque .n,
#densMore .chip.plaque .n:only-child {
  font-size: .84rem !important;
}

/* See-Through Red Cross Overlay on Unbettable Chips & Plaques */
.cant-bet {
  position: relative;
}
.no-bet-cross {
  position: absolute;
  inset: -2px;
  z-index: 6;
  pointer-events: none;
  display: grid;
  place-items: center;
  border-radius: inherit;

.no-bet-cross svg {

@media (max-width: 420px) {

}

/* ===== v16/v17: NON-OVERLAPPING RECTANGULAR BLACK-FELT TABLE, METAL RIM, RED BACKGROUND & 35 IMAGE-ONLY CHALLENGE BADGES ===== */
#table {

    radial-gradient(ellipse at 50% 50%, #b81824 0%, #780b14 55%, #380308 100%),

#oval {

  inset: 10% 5% 6% 5% !important;

  border: 10px solid transparent !important;
  background:
    radial-gradient(ellipse at 50% 50%, #262930 0%, #121418 64%, #07080a 100%) padding-box,
    linear-gradient(135deg, #f0f4f8 0%, #7d8792 18%, #ffffff 38%, #485058 60%, #d5dce4 82%, #586068 100%) border-box !important;
  box-shadow:
    inset 0 0 0 2px #9aa4b0,
    inset 0 0 48px #000e,

    0 0 0 7px #1a1d21,
    0 18px 36px #000d !important;

#oval::before {

  left: 50% !important;
  right: auto !important;

}
#oval::after {

#tfx {

<script>

const catOf = v => Math.floor(v / BASE);

}

}
function next() { if (!G.over && G.toAct >= 0) { G.tEnd = performance.now() + 50000; G.tFor = G.toAct; } render(); if (!G.over && G.toAct > 0) { const i = G.toAct; later(() => botMove(i), 800 + Math.random() * 500 + Math.max(0, (G.dealUntil || 0) - performance.now())); } }
function act(i, type, to) {

  if (sd) live().forEach(p => { p.val = best7([...p.hand, ...G.board]); const hr = p.hand.map(c => c.r).sort((a, b) => b - a); p.key = p.val * 300 + hr[0] * 15 + hr[1]; });   // key = hand strength, then hole cards

/* ---------- Bots ---------- */
function preflop(h) {
  const [a, b] = h.map(c => c.r).sort((x, y) => y - x);

  }
  if (canRaise && eq > 0.74) return act(i, 'raise', rTo(0.8));
  if (eq > odds + (0.1 - iq * 0.08) || (iq < 0.3 && Math.random() < 0.5)) return act(i, 'call');
  return act(i, 'fold');
}
function botMove(i) {
  if (G.over || G.toAct !== i) return;
  if (G.mode === 'lesson') return lessonBotMove(i);
  if (G.p[i].iq !== undefined) return smartMove(i);
  const b = G.p[i], call = Math.min(G.cur - b.bet, b.chips), pt = pot(), lv = live().length;
  let s = G.stage === 0 ? preflop(b.hand) : [0.15, 0.45, 0.7, 0.8, 0.88, 0.9, 0.95, 0.98, 1][catOf(best7([...b.hand, ...G.board]))];
  s += (Math.random() - 0.5) * b.noise - 0.04 * (lv - 2);
  const bluff = Math.random() < 0.06, canRaise = maxTo(i) > G.cur && G.rc < 3, rTo = f => Math.round(G.cur + pt * f);
  if (call === 0) {
    if (canRaise && (s > 0.62 || bluff)) act(i, 'raise', rTo(0.6));
    else if (canRaise && s > 0.4 && Math.random() < 0.3) act(i, 'raise', rTo(0.4));
    else act(i, 'call');
  } else {
    const odds = call / (pt + call);
    if (canRaise && s > 0.8) act(i, 'raise', rTo(0.9));
    else if (s > odds + 0.08 || (bluff && call < pt * 0.5)) act(i, 'call');
    else act(i, 'fold');
  }
}

function getBadgeProgress(b, u = activeProf()) {
  if (!u) return 0;
  const st = u.st || {}, lp = u.lp || {}, bw = u.bw || {};
  switch (b.stat) {
    case 'rank_elo': return Math.max(u.elo || 0, u.best || 0);
    case 'risk_elo': {
      const rCur = u.risk == null ? 100 : u.risk;
      const rBest = u.rbest || 100;
      const maxR = Math.max(rCur, rBest);
      return maxR > 100 ? maxR : (st.risk_played ? rCur : 0);
    }
    case 'les_done': return Object.keys(lp).filter(k => lp[k] > 0).length;
    case 'les_basics': return LESSONS.slice(0, 8).filter(l => (lp[l.id] || 0) > 0).length;
    case 'les_elite': return LESSONS.filter(l => l.lv === 2 && (lp[l.id] || 0) > 0).length;
    case 'quads_sf': return (st.quads || 0) + (st.sf || 0);
    case 'bots_unique': return Object.keys(bw).filter(k => bw[k] > 0).length;
    default: return st[b.stat] || 0;
  }
}

function isBadgeUnlocked(b, u = activeProf()) {
  if (!u) return false;
  u.ub = u.ub || {};
  if (u.ub[b.id]) return true;
  if (getBadgeProgress(b, u) >= b.goal) {
    u.ub[b.id] = 1;
    return true;
  }
  return false;
}

function checkBadgeUnlocks(u = activeProf(), silent = false) {
  if (!u) return;
  u.ub = u.ub || {};
  let newlyUnlocked = [];
  CHALLENGE_BADGES.forEach(b => {
    const was = !!u.ub[b.id];
    if (!was && getBadgeProgress(b, u) >= b.goal) {
      u.ub[b.id] = 1;
      newlyUnlocked.push(b);
    }
  });
  if (newlyUnlocked.length) {
    if (!u.badge || u.badge === 'none' || !CHALLENGE_BADGES.some(x => x.id === u.badge && u.ub[x.id])) {
      u.badge = newlyUnlocked[newlyUnlocked.length - 1].id;
    }
    saveActiveProf();
    if (!silent) {
      const lastB = newlyUnlocked[newlyUnlocked.length - 1];
      setTimeout(() => {
        sfx('win');
        showToast(`<span style="display:inline-flex;align-items:center;gap:8px"><span style="width:26px;height:26px;display:inline-block">${lastB.svg}</span><span><b>Badge Unlocked: ${lastB.name}!</b><br><small style="color:var(--gold)">${lastB.how} · Equip it in Profile!</small></span></span>`);

    }
  }
}

function getEquippedBadge(u = activeProf()) {
  if (!u) return null;
  checkBadgeUnlocks(u, true);
  if (!u.badge || u.badge === 'none') return null;
  const found = CHALLENGE_BADGES.find(b => b.id === u.badge && isBadgeUnlocked(b, u));
  return found || null;
}

/* Small image-only badge next to your name (NO TEXT!) */
function equippedBadgeHTML(u = activeProf()) {
  const b = getEquippedBadge(u);
  if (!b) return '';
  return `<span class="name-badge-img" title="${b.name} — ${b.how}">${b.svg}</span>`;
}

function addXP(u, n) {
  const target = u || activeProf();
  if (!target || !n) return;
  const oldLvl = userLevel(target);
  target.xpt = xtot(target) + n;
  target.xp = (target.xp || 0) + n;
  const newLvl = userLevel(target);
  checkBadgeUnlocks(target, false);
  saveActiveProf();
  if (newLvl > oldLvl) {
    setTimeout(() => {
      sfx('win');
      showToast(`🎉 <b>LEVEL UP! Level ${newLvl}</b> reached! New Lessons unlocked on the Learn pathway!`);
    }, 400);
  }
}
const fmtXP = n => Number(n || 0).toLocaleString('en-US') + ' XP';
const fmtCash = fmtXP;
function bump(k, n) {
  const u = activeProf();
  if (u) {
    u.st = u.st || {};
    u.st[k] = (u.st[k] || 0) + (n || 1);
    checkBadgeUnlocks(u, false);
    saveActiveProf();
    updQBadge();
  }
}

/* ---- sound + haptics ---- */
let AC;
function tone(f, d, type, v, when) {
  if (!cfg.snd) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), s = AC.currentTime + (when || 0);
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(v, s); g.gain.exponentialRampToValueAtTime(0.001, s + d);
    o.connect(g); g.connect(AC.destination); o.start(s); o.stop(s + d);
  } catch (e) {}
}
const vib = p => { if (cfg.hap && navigator.vibrate) navigator.vibrate(p); };
function sfx(n) {
  if (n === 'deal') { tone(900, .05, 'square', .05); tone(600, .06, 'square', .04, .06); }
  else if (n === 'check') { tone(180, .09, 'triangle', .35); vib(12); }
  else if (n === 'chip') { tone(1400, .05, 'triangle', .12); tone(1900, .09, 'triangle', .1, .05); vib(12); }
  else if (n === 'fold') { tone(160, .28, 'sawtooth', .06); vib(8); }
  else if (n === 'win') [523, 659, 784, 1047].forEach((f, i) => tone(f, .28, 'triangle', .15, i * .09));
  else if (n === 'lose') { tone(220, .3, 'triangle', .1); tone(165, .4, 'triangle', .1, .15); }
  else if (n === 'click') tone(700, .03, 'sine', .08);
}

function go(i, quiet) {
  cur = i; pg.style.transform = `translateX(${-i * 100}%)`;

  if (!quiet) sfx('click');

let sx = 0, sy = 0, dx = 0, drag = false, lock = false;
pg.addEventListener('touchstart', e => { if (e.target.closest('input')) return; sx = e.touches[0].clientX; sy = e.touches[0].clientY; dx = 0; drag = true; lock = false; pg.style.transition = 'none'; }, { passive: true });
pg.addEventListener('touchmove', e => {
  if (!drag) return;
  dx = e.touches[0].clientX - sx;
  if (!lock && Math.abs(e.touches[0].clientY - sy) > Math.abs(dx)) { drag = false; pg.style.transition = ''; pg.style.transform = `translateX(${-cur * 100}%)`; return; }
  if (!lock && Math.abs(dx) < 10) return; lock = true; pg.style.transform = `translateX(calc(${-cur * 100}% + ${dx}px))`;
}, { passive: true });
pg.addEventListener('touchend', () => {
  if (!drag) return; drag = false; pg.style.transition = '';

  go(dx < -60 ? Math.min(3, cur + 1) : dx > 60 ? Math.max(0, cur - 1) : cur, dx === 0);
});

function lessonBotMove(i) {

  if (id === 'hands') {
    if (cat >= 2 && canRaise) return act(i, 'raise', rTo(0.85));

    if (cat >= 2 || (cat === 1 && call <= pt * 0.35)) return act(i, 'call');
    return act(i, 'fold');
  }
  if (id === 'flow') {
    if (G.stage === 1) return act(i, call === 0 || (cat >= 1 && call <= pt * 0.6) ? 'call' : 'fold');
    if (G.stage === 2) {
      if (call === 0 && cat >= 1 && canRaise) return act(i, 'raise', rTo(0.33));
      return act(i, cat >= 1 && call <= pt * 0.6 ? 'call' : call === 0 ? 'call' : 'fold');
    }
    if (call === 0 && cat >= 2 && canRaise) return act(i, 'raise', rTo(0.9));
    return act(i, cat >= 2 || (cat === 1 && call <= pt * 0.3) ? 'call' : call === 0 ? 'call' : 'fold');
  }
  if (id === 'start') {
    if (G.dealer === i) {
      if (canRaise && (call === 0 || cat >= 1)) return act(i, 'raise', rTo(0.66));
      return act(i, call <= pt * 0.5 || cat >= 1 ? 'call' : 'fold');
    }
    if (call === 0) return act(i, cat >= 2 && canRaise ? 'raise' : 'call', rTo(0.6));

    if (call === 0 && canRaise) return act(i, 'raise', rTo(0.25));
    if (call > 0) return act(i, cat >= 2 || call <= pt * 0.25 ? 'call' : 'fold');

    return act(i, 'fold');

  if (id === 'board') {

  if (id === 'ev') {
    if (call === 0 && canRaise && (cat === 0 || cat >= 2)) return act(i, 'raise', rTo(1.0));

  if (id === 'mdf') {

    if (cat >= 2 || (cat === 1 && !flushy && id !== 'exploit' && call <= pt * 0.4)) return act(i, 'call');
    return act(i, 'fold');
  }
  if (id === 'ranges') {
    if (call === 0 && canRaise) {
      if (cat === 1) return act(i, 'raise', rTo(0.25));
      if (cat === 0 || cat >= 3) return act(i, 'raise', rTo(1.0));

    return act(i, cat >= 2 || call === 0 ? 'call' : 'fold');
  }
  if (id === 'nutadv') {
    if (G.stage === 1 && call > 0 && cat >= 1) return act(i, 'call');
    if (G.stage >= 2 && call === 0) return act(i, 'call');

    return act(i, cat >= 1 || call === 0 ? 'call' : 'fold');
  }
  if (id === 'barrel') {
    if (G.stage <= 2 && call > 0 && (cat >= 1 || call <= pt * 0.8)) return act(i, 'call');

    if (call === 0 && canRaise) return act(i, 'raise', rTo(0.85));
    if (call > 0) return act(i, cat >= 2 ? 'call' : 'fold');

/* ---------- Lesson Flow ---------- */
const shuf = a => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(x => x[1]);
function closeLesson() {

function openLesson(id) {

function renderLearn() {
  const lp = lpObj();
  let activeIdx = LESSONS.findIndex(l => !lp[l.id]);
  if (activeIdx < 0) activeIdx = LESSONS.length - 1;

  // Spread-out pathway coordinates for each lesson chip (1 to 20)
  const pts = LESSONS.map((les, i) => {
    const xPct = 50 - Math.cos(i * 0.9 + 0.3) * 35;
    const xSvg = (xPct / 100) * 360;
    const yPx = 80 + i * 185;
    return { les, idx: i, num: i + 1, xPct, xSvg, yPx };
  });

  // Build smooth cubic bezier SVG path connecting chip 1 -> 2 -> ... -> 20
  let fullPathD = '';
  let litPathD = '';
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    if (i === 0) {
      fullPathD += `M ${p.xSvg.toFixed(1)} ${p.yPx}`;
      litPathD += `M ${p.xSvg.toFixed(1)} ${p.yPx}`;
    } else {
      const prev = pts[i - 1];
      const midY = (prev.yPx + p.yPx) / 2;
      const seg = ` C ${prev.xSvg.toFixed(1)} ${midY.toFixed(1)}, ${p.xSvg.toFixed(1)} ${midY.toFixed(1)}, ${p.xSvg.toFixed(1)} ${p.yPx}`;
      fullPathD += seg;
      if (lp[prev.les.id]) litPathD += seg;
    }
  }

  const curLvl = userLevel();
  const chipsHtml = pts.map(p => {
    const stars = lp[p.les.id] || 0;

      ${stars ? `<span class="path-chip-stars">${'★'.repeat(stars)}</span>` : ''}
      <span class="path-les-label ${descSide}${isElite ? ' elite-label' : ''}">
        <span class="path-les-tier lv-${p.les.lv}">${tierName(p.les.lv)} · Lvl ${reqLvl}</span>
        <b>${p.les.t}</b>
        <span>${p.les.d} · +${p.les.xp * 5} XP</span>
      </span>
    </button>`;
  }).join('');

  $('pLearn').innerHTML = `
    <div class="felt-table-stage">
      <div class="learn-content-layer">
        <div class="top">
          <h1 class="logo">♠ LEARN <b>♥</b></h1>

        <div class="learn-tier-legend">
          <span class="tier-pill t-bas">1–8 Basics</span>
          <span class="tier-pill t-adv">9–17 Advanced</span>
          <span class="tier-pill t-eli">★ 18–20 Elite</span>
        </div>
        <div class="chip-pathway-wrap">
          ${greenFeltDecorHTML()}
          <svg class="chip-pathway-svg" viewBox="0 0 360 3690" preserveAspectRatio="none">
            <path class="path-dotted-bg" d="${fullPathD}"/>
            <path class="path-dotted-lit" d="${litPathD}"/>
          </svg>
          ${chipsHtml}
        </div>
      </div>
    </div>
  `;
}

/* ---------- spectate a past game ---------- */
let RP = null;
const dc = n => ({ r: n >> 2, s: n & 3 });
function rpState(hd, t) {
  const chips = hd.st.map((x, i) => x - hd.bl[i]); let pot = hd.bl.reduce((a, b) => a + b, 0); const folded = hd.c.map(c => !c); let last = null;
  for (let k = 0; k < t; k++) { const [p, code, amt, , ai] = hd.a[k]; chips[p] -= amt; pot += amt; if (code === 0) folded[p] = true; last = { p, code, amt, ai }; }
  return { chips, pot, folded, last };
}
const ACT = ['folds', 'calls', 'checks', 'bets', 'raises'];
function rpDraw() {
  const g = RP.g, hd = g.h[RP.h], len = hd.a.length, t = RP.t, fin = t >= len, s = rpState(hd, t), chips = fin ? hd.ch : s.chips;
  const bl = fin ? hd.b.length : hd.a[t][3], actor = fin ? -1 : hd.a[t][0];
  $('rpTitle').textContent = `${MODE_N[g.mode] || g.mode} · hand ${RP.h + 1}/${g.h.length}`;
  const txt = fin ? hd.w.map((w, i) => (w > 0 ? `${g.names[i]} wins ${w}` : '')).filter(Boolean).join(' · ') + (hd.sd ? ' (showdown)' : ' (everyone else folded)') : s.last ? `${g.names[s.last.p]} ${ACT[s.last.code]}${s.last.amt ? ' ' + s.last.amt : ''}${s.last.ai ? ' (all-in)' : ''}` : 'Blinds posted';
  $('rpInfo').innerHTML = `<div class="rpl">${txt}</div>`;
  $('rpTable').innerHTML = `<div class="rpb"><div class="rpot"><span class="mc"></span>Pot ${fin ? hd.i.reduce((a, b) => a + b, 0) : s.pot}</div><div class="cards">${hd.b.slice(0, bl).map(n => lcard(dc(n))).join('')}</div></div><div class="rps">` + g.names.map((nm, i) => !hd.c[i] ? '' : `<div class="rpp ${i === actor ? 'act' : ''} ${(fin ? hd.w[i] > 0 : false) ? 'win' : ''} ${(!fin && s.folded[i]) ? 'fold' : ''}"><b>${nm}</b><span><i class="mc"></i>${chips[i]}</span><div class="cards sm2">${hd.c[i].map(n => lcard(dc(n))).join('')}</div><small>${i === hd.dl ? 'Dealer · ' : ''}${!fin && s.folded[i] ? 'Folded' : ''}</small></div>`).join('') + '</div>';
}
function openReplay(i) { const g = loadHist()[i]; if (!g || !g.h.length) return; RP = { g, h: 0, t: 0, timer: 0 }; $('replay').classList.add('on'); rpDraw(); }
function rpStop() { clearTimeout(RP && RP.timer); if (RP) RP.timer = 0; if ($('rpPlay')) $('rpPlay').textContent = '▶'; }
function rpStep(d) { const hd = RP.g.h[RP.h]; RP.t = Math.max(0, Math.min(hd.a.length, RP.t + d)); sfx('click'); rpDraw(); }
function rpHand(d) { rpStop(); RP.h = Math.max(0, Math.min(RP.g.h.length - 1, RP.h + d)); RP.t = 0; rpDraw(); }
function rpAuto() { if (!RP || !RP.timer) return; const hd = RP.g.h[RP.h]; if (RP.t < hd.a.length) rpStep(1); else if (RP.h < RP.g.h.length - 1) { RP.h++; RP.t = 0; rpDraw(); } else return rpStop(); RP.timer = setTimeout(rpAuto, 1100); }
$('rpP').onclick = () => { rpStop(); rpStep(-1); }; $('rpN').onclick = () => { rpStop(); rpStep(1); }; $('rpHP').onclick = () => rpHand(-1); $('rpHN').onclick = () => rpHand(1);
$('rpPlay').onclick = () => { if (RP.timer) return rpStop(); $('rpPlay').textContent = '❚❚'; RP.timer = setTimeout(rpAuto, 300); };
$('rpBack').onclick = () => { rpStop(); $('replay').classList.remove('on'); RP = null; };

function breakdown(n) {
  n = Math.max(0, Math.floor(n || 0));

  const inRisk = G && G.mode === 'risk';
  if (!inRisk && n <= 250) {
    const sc = n / 110, m = {};

      </div>
      <div class="dens-tier-row">
        <span class="dens-tier-tag">1,000+ High-Stakes Plaques (1,000 · 5,000 · 10,000)</span>
        ${DEN_RISK_PLAQUES.map(d => renderTrayDenomBtn(d, tot, mx)).join('')}
      </div>
    </div>` : '';
    $('dens').innerHTML = `<div class="dens-main-row">${normSixHtml}${arrowBtnHtml}</div>${moreDrawerHtml}`;
  } else {
    $('dens').innerHTML = `<div class="dens-main-row">${[1, 5, 10, 25].map(d => renderTrayDenomBtn(d, tot, mx)).join('')}</div>`;
  }

  $('tOk').disabled = !ok; $('tOk').textContent = ok ? `Finish · ${fmtDenom(tot)}` : 'Finish';
}

$('dens').onclick = e => {
  const toggleBtn = e.target.closest('[data-toggle-more]');
  if (toggleBtn) {
    trayMoreOpen = !trayMoreOpen;
    sfx('click');
    drawTray();
    return;
  }
  const b = e.target.closest('button[data-d]');
  if (b && !b.disabled) {
    const d = +b.dataset.d;
    pending += d;
    pendingPicked.push(d);
    sfx('chip');
    drawTray();
  }
};
$('pend').onclick = e => {
  const p = e.target.closest('.pile');
  if (p) {
    const d = +p.dataset.d;
    pending = Math.max(0, pending - d);
    const idx = pendingPicked.lastIndexOf(d);
    if (idx >= 0) pendingPicked.splice(idx, 1);
    else pendingPicked = [];
    sfx('click');
    drawTray();
  }
};
$('tUndo').onclick = () => { pending = 0; pendingPicked = []; drawTray(); };
$('tCancel').onclick = closeTray;
$('tAll').onclick = () => { const { m, mx } = lim(); pending = mx - m.bet; pendingPicked = []; sfx('chip'); drawTray(); };
$('tOk').onclick = () => {
  const { m } = lim(), tot = m.bet + pending;
  const usedSet = new Set(pendingPicked.length ? pendingPicked : breakdown(pending).map(x => x[0]));
  [250, 500, 1000, 5000, 10000].forEach(d => { if (usedSet.has(d)) bump('use_' + d); });
  G.noFly = true; flyFrom($('pend'), $('potPile'), pending); closeTray(); act(0, 'raise', tot); G.noFly = false;
};

const TURN_MS = 50000;
function clockTick() {
  if (!G || G.ended) return; const c = $('clock'); if (!c) return;
  if (G.over || G.toAct < 0 || !G.tEnd) { c.classList.add('idle'); return; }
  c.classList.remove('idle');
  const left = Math.max(0, G.tEnd - performance.now()), sec = Math.ceil(left / 1000), p = G.p[G.toAct];
  $('clockn').textContent = `${p.name === 'You' ? 'Your turn' : p.name}  ·  ${sec}s`; $('clockb').style.width = (left / TURN_MS) * 100 + '%'; c.classList.toggle('low', sec <= 10);
  if (G.toAct === 0 && sec <= 5 && sec !== G.lastBeep && left > 0) { G.lastBeep = sec; sfx('click'); vib(10); }
  if (left <= 0 && G.tFor === G.toAct) { const i = G.toAct, nm = p.name === 'You' ? 'You ran' : p.name + ' ran'; G.tEnd = 0; act(i, 'fold'); say(`${nm} out of time and folds.`); }
}
setInterval(clockTick, 250);

/* ---- events ---- */
$('tAI').onclick = () => {
  sfx('click');
  openSheet(`<h2>Quick match</h2><p class="mut" style="margin:0 0 8px">Choose your table</p><button class="btn" id="qm1">👤 1 opponent · Heads-up</button><button class="btn" id="qm4">👥 4 opponents · 5 players</button><button class="btn alt" id="qmx">Cancel</button>`);
  $('qm1').onclick = () => { closeSheet(); launch('ai', 1); }; $('qm4').onclick = () => { closeSheet(); launch('ai', 4); }; $('qmx').onclick = closeSheet;
};
$('tRank').onclick = () => { sfx('click'); needAuth(() => launch('ranked')); };
$('fold').onclick = () => act(0, 'fold');
$('call').onclick = () => act(0, 'call');
$('raise').onclick = openTray;
$('nextBtn').onclick = () => { const f = G.after; if (!f) return; G.after = null; sfx('click'); $('nextBox').classList.add('hidden'); f(); };
const pot = () => G.pot + G.p.reduce((a, p) => a + p.bet, 0);
$('restart').onclick = () => askConfirm('Restart the table with fresh stacks?', () => { const o = G.opps; G.ended = true; begin('ai', o, false); });
$('leave').onclick = () => {
  if (G.ended) return leaveTable();
  if (G.mode === 'lesson') {
    askConfirm('Leave this Lesson Match? Your progress in this lesson will reset.', () => {
      G.ended = true;
      $('table').classList.remove('on');
      $('lesson').classList.remove('on');
      LZ = null;
      go(3, true);
    });
    return;
  }
  if (G.mode === 'ranked') { askConfirm('Leaving a ranked match is a forfeit (−100 Elo). Leave?', () => endMatch(true)); }
  else if (G.mode === 'risk') { askConfirm('Leaving a RISK match forfeits ALL of your risk chips. Leave?', () => endMatch(true)); }
  else { saveGame(true); G.ended = true; leaveTable(); }
};
refresh();

</script></body></html>
